backend:
  name: github
  repo: omarketonlinestore-cmyk/o-market
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Réglages du Site (Branding & En-tête)"
    files:
      - file: "site-settings.json"
        label: "Configuration Générale"
        name: "general"
        fields:
          - { label: "Nom de la Boutique (Affiché comme logo)", name: "storeName", widget: "string" }
          - { label: "Sous-titre du logo (ex: Online Store)", name: "tagline", widget: "string" }
          - { label: "Bandeau d'Annonce (Haut de page)", name: "announcement", widget: "string" }
          - { label: "Ligne au-dessus du titre principal", name: "eyebrow", widget: "string" }
          - { label: "Grand Titre Principal (une ligne par phrase)", name: "headline", widget: "text" }
          - { label: "Sous-titre sous le grand titre", name: "heroSubtext", widget: "text" }
          - { label: "Titre de la section catalogue", name: "sectionTitle", widget: "string" }
          - { label: "Numéro WhatsApp (sans + ni espaces, ex: 212600000000)", name: "whatsappNumber", widget: "string" }
          - { label: "Texte avant le lien WhatsApp du pied de page", name: "footerNote", widget: "string" }
          - { label: "Note de confirmation de commande", name: "confirmNote", widget: "text" }

  - name: "products"
    label: "Produits"
    files:
      - file: "products.json"
        label: "Catalogue des Produits"
        name: "catalog"
        fields:
          - label: "Produits"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}} DH"
            fields:
              - { label: "Nom du Produit", name: "name", widget: "string" }
              - { label: "Prix actuel (DH, chiffres uniquement)", name: "price", widget: "number", value_type: "int" }
              - { label: "Ancien Prix (Optionnel, chiffres uniquement)", name: "oldPrice", widget: "number", value_type: "int", required: false }
              - { label: "Badge (ex: Meilleure Vente, Nouveau)", name: "badge", widget: "string", required: false }
              - { label: "Courte Description / Spécifications", name: "spec", widget: "string", required: false }
              - { label: "Photo du Produit", name: "image", widget: "image" }
